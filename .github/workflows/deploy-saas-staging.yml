name: Deploy SaaS Staging
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA from main
        required: true
jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - run: echo "Deploy staging with pinned SHA"
