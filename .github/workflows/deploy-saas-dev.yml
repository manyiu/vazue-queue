name: Deploy SaaS Dev
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ false }} # enable when AWS OIDC roles exist
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to vazue-queue-dev → *.dev.queue.vazue.com (OIDC)"
