name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/landing-cdk/**'
      - 'docs/deploy/**'
      - 'openapi/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Set repository variable AWS_ROLE_ARN (see GithubOidcStack DeployRoleArn output).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vazue/landing-cdk run deploy
