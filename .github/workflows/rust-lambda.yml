name: Rust Lambda CI
on:
  push:
    paths: ['packages/core-rust/**', 'scripts/build-lambda-assets.sh']
  pull_request:
    paths: ['packages/core-rust/**', 'scripts/build-lambda-assets.sh']
  workflow_dispatch:
jobs:
  cargo-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cargo-lambda
        run: pip install cargo-lambda
      - name: Unit tests
        working-directory: packages/core-rust
        run: cargo test --workspace
      - name: Build Lambda assets (best-effort)
        run: |
          chmod +x scripts/build-lambda-assets.sh
          scripts/build-lambda-assets.sh || true
      - name: Upload artifacts when present
        uses: actions/upload-artifact@v4
        with:
          name: vazue-lambda-zips
          path: packages/cdk/assets/lambda/*.zip
          if-no-files-found: warn
