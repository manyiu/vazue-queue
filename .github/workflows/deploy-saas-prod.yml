name: Deploy SaaS Prod
on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA previously deployed to staging
        required: true
jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - run: echo "Promote same SHA to prod"
