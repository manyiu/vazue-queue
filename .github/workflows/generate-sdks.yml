name: Generate SDKs
on:
  workflow_dispatch:
  push:
    paths:
      - openapi/vazue-queue.yaml
      - scripts/generate-sdks.sh
      - packages/sdk-go/**
      - packages/sdk-java/**
      - .github/workflows/generate-sdks.yml
  pull_request:
    paths:
      - openapi/vazue-queue.yaml
      - scripts/generate-sdks.sh
      - packages/sdk-go/**
      - packages/sdk-java/**
      - .github/workflows/generate-sdks.yml
jobs:
  # Native Go/JDK on the runner. Local Docker helpers: scripts/sdk-*-test.sh
  hand-polished:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Go SDK tests
        working-directory: packages/sdk-go
        run: go test -count=1 ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: packages/sdk-java/pom.xml

      - name: Java SDK tests
        working-directory: packages/sdk-java
        run: mvn -B test

  # OpenAPI Generator has no first-class setup-* action we rely on; Docker image is OK.
  generate-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Go/Java reference stubs (Docker)
        run: bash scripts/generate-sdks.sh
      - name: Confirm generated trees
        run: |
          test -d packages/sdk-generated/go
          test -d packages/sdk-generated/java
