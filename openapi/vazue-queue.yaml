openapi: 3.2.0
info:
  title: Vazue Queue API
  version: 1.0.0
  description: |
    Virtual waiting room Queue API and Management API.
    Admit tokens are returned on GET status when the visitor is admitted.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:3000
    description: Local data plane
  - url: https://queue.example.com
    description: OSS self-hosted
  - url: https://api.queue.vazue.com
    description: SaaS management (Phase 5)
paths:
  /health:
    get:
      operationId: health
      tags: [Ops]
      description: Liveness. No auth. Data plane :3000 and admin :3001 both expose this.
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
  /ready:
    get:
      operationId: ready
      tags: [Ops]
      description: Readiness. No auth. Returns deployment profile and tenantId.
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  deployment: { type: string }
                  tenantId: { type: string }
  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Management]
      responses:
        '200':
          description: Deployment capabilities and plan limits
  /v1/events/{eventId}/enroll:
    post:
      operationId: enroll
      tags: [Queue]
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
      responses:
        '201':
          description: Enrolled synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '202':
          description: |
            Accepted for async enroll buffer (SQS). Returns the same EnrollResponse shape
            with status=enrolled and position=0; poll GET status with request_id (404 until worker writes the visitor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '409':
          description: Conflict (paused, captcha, invite)
  /v1/events/{eventId}/status:
    get:
      operationId: status
      tags: [Queue]
      parameters:
        - $ref: '#/components/parameters/eventId'
        - name: request_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Status; includes admit_token and return_url when admitted=true.
            Cache-Control max-age follows poll_after_seconds so CloudFront can absorb poll storms
            (cache key includes request_id).
          headers:
            Cache-Control:
              schema: { type: string }
              description: public, max-age={poll_after_seconds}, stale-while-revalidate=1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/events/{eventId}/admit:
    post:
      operationId: admit
      tags: [Queue]
      description: Optional explicit admit; prefer status when admitted=true
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
      responses:
        '200':
          description: Admit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/rooms:
    get:
      operationId: listRooms
      tags: [Management]
      responses:
        '200':
          description: Rooms
    post:
      operationId: createRoom
      tags: [Management]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Room'
      responses:
        '201':
          description: Created
  /v1/events:
    get:
      operationId: listEvents
      tags: [Management]
      responses:
        '200':
          description: Events
    post:
      operationId: createEvent
      tags: [Management]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventConfig'
      responses:
        '201':
          description: Created
  /v1/events/{eventId}:
    put:
      operationId: updateEvent
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveOverrides'
      responses:
        '200':
          description: Updated
  /v1/events/{eventId}/stats:
    get:
      operationId: getEventStats
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: Live queue depth and serving counters for the owner console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStats'
components:
  parameters:
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
  schemas:
    EnrollRequest:
      type: object
      properties:
        request_id:
          type: string
          description: Optional; set by enroll Lambda for async buffer so the worker uses a stable id
        session_id:
          type: string
        return_url:
          type: string
          format: uri
          description: |
            Destination after admit. Waiting room redirects to this URL and appends vazue_token.
            If omitted, the event's return_url is stored. Owners must preserve this deep link.
        invite_code:
          type: string
        turnstile_token:
          type: string
    EnrollResponse:
      type: object
      required: [request_id, session_id, position, status]
      properties:
        request_id: { type: string }
        session_id: { type: string }
        position: { type: integer }
        status: { $ref: '#/components/schemas/VisitorStatus' }
    StatusResponse:
      type: object
      required: [request_id, position, serving, status, admitted]
      properties:
        request_id: { type: string }
        position: { type: integer }
        serving: { type: integer }
        wait_estimate_minutes: { type: number }
        poll_after_seconds: { type: integer }
        status: { $ref: '#/components/schemas/VisitorStatus' }
        admitted: { type: boolean }
        admit_token: { type: string }
        return_url:
          type: string
          format: uri
          description: Stored at enroll; waiting room uses this as the post-admit redirect target.
        dress_rehearsal:
          type: boolean
          description: True when the event is in dress-rehearsal mode (practice queue).
    VisitorStatus:
      type: string
      enum: [enrolled, waiting, admitted, expired, blocked]
    Room:
      type: object
      required: [room_id, name]
      properties:
        room_id: { type: string }
        name: { type: string }
        theme: { type: object, additionalProperties: true }
        queue:
          type: object
          properties:
            default_throughput_per_minute: { type: integer }
            counter_shards: { type: integer }
            token_ttl_seconds: { type: integer }
            visitor_record_ttl_hours: { type: integer }
    EventConfig:
      type: object
      required: [event_id, room_id]
      properties:
        event_id: { type: string }
        room_id: { type: string }
        throughput_per_minute: { type: integer }
        paused: { type: boolean }
        emergency_open: { type: boolean }
        invite_only: { type: boolean }
        dress_rehearsal:
          type: boolean
          description: Practice mode — queue runs normally; origins should reject admit tokens for real sales.
        bot_protection:
          type: string
          enum: [off, rate_limit_only, challenge_suspicious, challenge_always]
        return_url: { type: string }
    LiveOverrides:
      type: object
      properties:
        paused: { type: boolean }
        emergency_open: { type: boolean }
        throughput_per_minute: { type: integer }
        invite_only: { type: boolean }
        dress_rehearsal: { type: boolean }
        bot_protection:
          type: string
          enum: [off, rate_limit_only, challenge_suspicious, challenge_always]
    EventStats:
      type: object
      required: [event_id, serving, queue_depth, waiting, admitted, throughput_per_minute]
      properties:
        event_id: { type: string }
        serving: { type: integer }
        queue_depth: { type: integer }
        waiting: { type: integer }
        admitted: { type: integer }
        throughput_per_minute: { type: integer }
        paused: { type: boolean }
        emergency_open: { type: boolean }
        dress_rehearsal: { type: boolean }
    RoomConfig:
      $ref: '#/components/schemas/Room'
    EventConfigBlob:
      $ref: '#/components/schemas/EventConfig'
  securitySchemes:
    CognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token (admin / management API)
tags:
  - name: Queue
  - name: Management
  - name: Ops
