[workspace]
resolver = "2"
members = [
  "crates/queue-kernel",
  "crates/queue-api",
  "crates/admin-api",
  "crates/platform",
]
default-members = [
  "crates/queue-kernel",
  "crates/queue-api",
  "crates/admin-api",
  "crates/platform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vazue/vazue-queue"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
jsonwebtoken = "10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sqs = "1"
lambda_http = "0.14"
lambda_runtime = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
queue-kernel = { path = "crates/queue-kernel" }
platform = { path = "crates/platform" }
admin-api = { path = "crates/admin-api" }
